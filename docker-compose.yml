services:
  mysql:
    image: mysql:8.0
    container_name: medlink_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medlink_db
      MYSQL_USER: medlink_user
      MYSQL_PASSWORD: medlink_password
    ports:
      - '3306:3306'
    volumes:
      - medlink_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medlink_mysql_data:
    driver: local
